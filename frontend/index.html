<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>applyZen — AI Career Copilot | Never Miss an Opportunity. We Apply. You Grow.</title>
  <meta name="description"
    content="applyZen automatically transforms career-related emails into structured, validated, traceable job-application workflows with zero hallucination guarantee." />
  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <!-- Google Identity Services (GIS) for Real Google OAuth -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- Instant Theme Initializer to prevent white flash -->
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('applyzen_theme');
        var isDark = saved === 'dark'; // Strictly default to light mode unless explicitly dark
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>
</head>
